name: agakai
description: AgakAI - a senior-citizen assistance app for benefits, voice help, and AI chat.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.5
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^6.0.1
  http: ^1.6.0
  flutter_markdown: ^0.7.7+1
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  audio_session: ^0.2.4
  record: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/lang/
    - assets/images/logo.png
    - assets/images/icon.png
    - assets/images/splash_logo.png

# App launcher icon (generated from assets/images/icon.png):
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/icon.png
  min_sdk_android: 21

# Native splash / startup screen (logo on white, also covers Android 12+):
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/splash_logo.png
  android: true
  ios: true
