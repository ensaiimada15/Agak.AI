name: agakai
description: AgakAI - a senior-citizen assistance app for OSCA Dumaguete benefits, voice help, and AI chat.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.2.1
  http: ^1.6.0
  flutter_markdown: ^0.7.7+1
  just_audio: ^0.10.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/data/
    - assets/images/logo.png
    - assets/images/avatar.png
    - assets/images/dashboard_hero.png
    - assets/data/benefits.json
